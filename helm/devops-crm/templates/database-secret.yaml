{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $name := include "crm.databaseSecret" . }}
{{- $auth := .Values.postgresql.auth }}
{{- /* PostgreSQL only reads the password at initdb, so reuse the stored one on upgrades. */}}
{{- $password := $auth.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data }}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "crm.labels" (dict "ctx" $ "component" "database") | nindent 4 }}
  annotations:
    # Survives `helm uninstall` so a reinstall can still open the retained volume.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s" (urlquery $auth.username) (urlquery $password) (include "crm.fullname" .) $auth.database | quote }}
{{- end }}
